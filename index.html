<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peppino's WebViewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p id="timestamp">Time</p>
    <p id="credit"> Credit: <a href="https://view.eumetsat.int/productviewer?v=mtg_fd:rgb_geocolour" target="_blank"> EUMETSAT</a> and <a href="https://blackmarble.gsfc.nasa.gov/#product" target="_blank">NASA </a></p>
    <div id="buttons_container">
        <button class = button_selectors id="button_world" type="button">W</button>
        <button class = button_selectors id="button_europe" type="button">E</button>
        <button class = button_selectors id="button_switzerland" type="button">S</button>
    </div>
    <div class="img_box">
        <img id="meteosatEurope" width="100%">
    </div>
    <script>
    
        // Set Views
        const views = {
            world: {
                bbox: "-77,-77,77,77",
                width: 2500,
                height: 2500
            },
            europe: {
                bbox: "29,-30,66,40",
                width: 5000,
                height: 2700
            },
            switzerland: {
                bbox: "44,4,49,12",
                width: 2500,
                height: 1350
            }
        };

        // Function to edit URL by Views and Time
        function loadView(viewName) {
            // 1. Current time
            const now = new Date();

            // 2. Subtract lag (20 minutes)
            const corrected = new Date(now.getTime() - 20 * 60 * 1000);

            // 3. Round DOWN to last 5-minute boundary (UTC-safe)
            corrected.setUTCMinutes(
                Math.floor(corrected.getUTCMinutes() / 5) * 5,
                0,   // seconds
                0    // milliseconds
            );

            // 4. Extract from fully corrected date
            const correctedDate = corrected.toISOString().split('T')[0];
            const correctedHours = String(corrected.getUTCHours()).padStart(2, '0');
            const correcedMinutes = String(corrected.getUTCMinutes()).padStart(2, '0');



            const view = views[viewName];

            const imageUrl = `https://view.eumetsat.int/geoserver/wms?service=WMS&request=GetMap&version=1.3.0&layers=mtg_fd:rgb_geocolour&format=image/jpeg&crs=EPSG:4326&bbox=${encodeURIComponent(view.bbox)}&width=${view.width}&height=${view.height}&time=${correctedDate}T${correctedHours}:${correcedMinutes}:00.000Z`;

            document.getElementById("meteosatEurope").src = imageUrl;

            document.getElementById('timestamp').innerHTML = corrected.toLocaleString("de-CH", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });

            localStorage.setItem("selectedView", viewName);
        }


        // Change View on Click
        document.getElementById("button_world")
            .addEventListener("click", () => loadView("world"));

        document.getElementById("button_europe")
            .addEventListener("click", () => loadView("europe"));

        document.getElementById("button_switzerland")
            .addEventListener("click", () => loadView("switzerland"));

        // Save View
        const savedView = localStorage.getItem("selectedView") || "europe";
        loadView(savedView);

    
    </script>

    <script>
    //auto refresh fn every 60 seconds
    function autoRefresh() {
        window.location = window.location.href;
    }
    setInterval(() => {
            const savedView = localStorage.getItem("selectedView") || "europe";
            loadView(savedView);
        }, 60000);

    </script>
</body>
</html>
