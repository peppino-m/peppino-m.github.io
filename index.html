<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peppino's WebViewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p id="timestamp">Time</p>
    <p id="credit"> Credit: <a href="https://view.eumetsat.int/productviewer?v=mtg_fd:rgb_geocolour" target="_blank"> EUMETSAT</a> and <a href="https://blackmarble.gsfc.nasa.gov/#product" target="_blank">NASA </a></p>
    <div id="buttons_container">
        <button class = button_selectors id="button_world" type="button">W</button>
        <button class = button_selectors id="button_europe" type="button">E</button>
        <button class = button_selectors id="button_switzerland" type="button">S</button>
    </div>
    <div class="img_box">
        <img id="meteosatEurope" width="100%">
    </div>
    <script>
        // Get current date and time and reduce it by 20 minutes
        const now = new Date();
        const nowMinusLag = new Date(now.getTime() - 20 * 60 * 1000); 

        // Get UTC components
        const utcDate = nowMinusLag.toISOString().split('T')[0];
        const utcMinutes = nowMinusLag.getUTCMinutes();
        const utcHours = nowMinusLag.getUTCHours();
        const utcDay = nowMinusLag.getDay();
        const utcMonth = nowMinusLag.getMonth();
        const utcYear = nowMinusLag.getFullYear();
        
        // Round DOWN to last quarter hour
        let utcRoundedMinutes;
        if (utcMinutes < 15) {
            utcRoundedMinutes = "00";
        } else if (utcMinutes >=15 && utcMinutes < 30) {
            utcRoundedMinutes = "15";
        } else if (utcMinutes >= 30 && utcMinutes < 45) {
            utcRoundedMinutes = "30";
        } else {
            utcRoundedMinutes = "45";
        }

        // Set Views
        const views = {
            world: {
                bbox: "-30,-77,70,77",
                width: 2500,
                height: 1350
            },
            europe: {
                bbox: "29,-30,66,40",
                width: 5000,
                height: 2700
            },
            switzerland: {
                bbox: "44,4,49,12",
                width: 2500,
                height: 1350
            }
        };

        // Function to edit URL by Views and Time
        function loadView(viewName) {
            const view = views[viewName];

            const imageUrl = `https://view.eumetsat.int/geoserver/wms?service=WMS&request=GetMap&version=1.3.0&layers=mtg_fd:rgb_geocolour&styles=&format=image/jpeg&crs=EPSG:4326&bbox=${encodeURIComponent(view.bbox)}&width=${view.width}&height=${view.height}&time=${encodeURIComponent(utcDate)}T${encodeURIComponent(utcHours)}:${encodeURIComponent(utcRoundedMinutes)}:00.000Z`;

            document.getElementById("meteosatEurope").src = imageUrl;

            // persist selection
            localStorage.setItem("selectedView", viewName);
        }

        // Change View on Click
        document.getElementById("button_world")
            .addEventListener("click", () => loadView("world"));

        document.getElementById("button_europe")
            .addEventListener("click", () => loadView("europe"));

        document.getElementById("button_switzerland")
            .addEventListener("click", () => loadView("switzerland"));

        // Save View
        const savedView = localStorage.getItem("selectedView") || "europe";
        loadView(savedView);

        // Edit timestamp on bottom
        document.getElementById('timestamp').innerHTML = utcDay + "." + utcMonth + "." + utcYear + " – " + utcHours + ":" + utcRoundedMinutes + " UTC"

    </script>

    <script>
        //auto refresh fn every 60 seconds
    function autoRefresh() {
        window.location = window.location.href;
    }
    setInterval(() => {
            const savedView = localStorage.getItem("selectedView") || "europe";
            loadView(savedView);
        }, 60000);
    </script>
</body>
</html>
