<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peppino's WebViewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p id="timestamp">Time</p>
    <p id="credit"> Credit: <a href="https://view.eumetsat.int/productviewer?v=mtg_fd:rgb_geocolour" target="_blank"> EUMETSAT</a> and <a href="https://blackmarble.gsfc.nasa.gov/#product" target="_blank">NASA </a></p>
    <div id="buttons_container">
        <button class = button_selectors id="button_world" type="button">W</button>
        <button class = button_selectors id="button_europe" type="button">E</button>
        <button class = button_selectors id="button_switzerland" type="button">S</button>
    </div>
    <div class="slidecontainer">
        <input type="range" min="-24" max="0" value="0" class="slider" id="time_slider">
    </div>  
    <div class="img_box">
        <img id="meteosatEurope" width="100%">
    </div>



    <script>
    document.addEventListener("DOMContentLoaded", () => {

        // ---------------------------
        // Views
        // ---------------------------
        const views = {
            world: {
                bbox: "-77,-77,77,77",
                width: 2500,
                height: 2500
            },
            europe: {
                bbox: "25,-30,70,40",
                width: 5000,
                height: 3300
            },
            switzerland: {
                bbox: "43,4,50,12",
                width: 2500,
                height: 1650
            }
        };

        // ---------------------------
        // Time handling
        // ---------------------------
        function getCurrentTime() {
            const now = new Date();

            // subtract 20 minutes
            const corrected = new Date(now.getTime() - 20 * 60 * 1000);

            // round down to nearest 5 minutes
            corrected.setUTCMinutes(
                Math.floor(corrected.getUTCMinutes() / 5) * 5,
                0,
                0
            );

            return corrected;
        }

        function editTimestamp(time) {
            document.getElementById("timestamp").innerHTML =
                time.toLocaleString("de-CH", {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                });
        }

        // ---------------------------
        // Load view
        // ---------------------------
        function loadView(viewName, time) {
            const view = views[viewName];

            const date = time.toISOString().split("T")[0];
            const hours = String(time.getUTCHours()).padStart(2, "0");
            const minutes = String(time.getUTCMinutes()).padStart(2, "0");

            const imageUrl =
                `https://view.eumetsat.int/geoserver/wms?service=WMS&request=GetMap&version=1.3.0` +
                `&layers=mtg_fd:rgb_geocolour` +
                `&format=image/jpeg` +
                `&crs=EPSG:4326` +
                `&bbox=${encodeURIComponent(view.bbox)}` +
                `&width=${view.width}` +
                `&height=${view.height}` +
                `&time=${date}T${hours}:${minutes}:00.000Z`;

            document.getElementById("meteosatEurope").src = imageUrl;

            localStorage.setItem("selectedView", viewName);
            editTimestamp(time);
        }

        // ---------------------------
        // Button handlers
        // ---------------------------
        function handleViewChange(viewName) {
            const time = getCurrentTime();
            const slider_element = document.getElementById("time_slider");
            const slider = Number(slider_element.value);
            var time_minus_slider = new Date(time.getTime() + slider * 60 * 60 * 1000);
            loadView(viewName, time_minus_slider);
        }

        document.getElementById("button_world")
            .addEventListener("click", () => handleViewChange("world"));

        document.getElementById("button_europe")
            .addEventListener("click", () => handleViewChange("europe"));

        document.getElementById("button_switzerland")
            .addEventListener("click", () => handleViewChange("switzerland"));

        // ---------------------------
        // Initial load
        // ---------------------------
        const savedView = localStorage.getItem("selectedView") || "europe";
        handleViewChange(savedView);

        // ---------------------------
        // Slider (currently logging only)
        // ---------------------------
        const slider = document.getElementById("time_slider");
        slider.oninput = function () {
            const savedView = localStorage.getItem("selectedView") || "europe";
            handleViewChange(savedView);
        };

        //auto refresh fn every 60 seconds
        function autoRefresh() {
            window.location = window.location.href;
        }
        setInterval(() => {
                const savedView = localStorage.getItem("selectedView") || "europe";
                handleViewChange(savedView);
            }, 60000);

    });

    </script>
</body>
</html>
