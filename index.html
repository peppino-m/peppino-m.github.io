<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peppino's WebViewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p id="timestamp">Time</p>
    <p id="credit"> Credit: <a href="https://view.eumetsat.int/productviewer?v=mtg_fd:rgb_geocolour" target="_blank"> EUMETSAT</a> and <a href="https://blackmarble.gsfc.nasa.gov/#product" target="_blank">NASA </a></p>
    <div>
        <button class = button_selectors id="button_world" type="button">World</button>
        <button class = button_selectors id="button_europe" type="button">Europe</button>
        <button class = button_selectors id="button_switzerland" type="button">Switzerland</button>
    </div>
    <div class="img_box">
        <img id="meteosatEurope" width="100%">
    </div>
    <script>
        // Get current date and time and reduce it by 20 minutes
        const now = new Date();
        const nowMinusLag = new Date(now.getTime() - 400 * 60 * 1000); 

        // Get UTC components
        const utcDate = nowMinusLag.toISOString().split('T')[0];
        const utcMinutes = nowMinusLag.getUTCMinutes();
        const utcHours = nowMinusLag.getUTCHours();
        const utcDay = nowMinusLag.getDay();
        const utcMonth = nowMinusLag.getMonth();
        const utcYear = nowMinusLag.getFullYear();
        
        // Round DOWN to last quarter hour
        let utcRoundedMinutes;
        if (utcMinutes < 15) {
            utcRoundedMinutes = "00";
        } else if (utcMinutes >=15 && utcMinutes < 30) {
            utcRoundedMinutes = "15";
        } else if (utcMinutes >= 30 && utcMinutes < 45) {
            utcRoundedMinutes = "30";
        } else {
            utcRoundedMinutes = "45";
        }

        let bbox = "29,-30,66,40";
        document.getElementById("button_world").addEventListener("click", () => {
            bbox = "-40,-77,70,77";
            const imageUrl = `https://view.eumetsat.int/geoserver/wms?service=WMS&request=GetMap&version=1.3.0&layers=mtg_fd:rgb_geocolour&styles=&format=image/jpeg&crs=EPSG:4326&bbox=${encodeURIComponent(bbox)}&width=1000&height=1000&time=${encodeURIComponent(utcDate)}T${encodeURIComponent(utcHours)}:${encodeURIComponent(utcRoundedMinutes)}:00.000Z`;
            document.getElementById('meteosatEurope').src = imageUrl;
        });
        document.getElementById("button_europe").addEventListener("click", () => {
            bbox = "29,-30,66,40";
            const imageUrl = `https://view.eumetsat.int/geoserver/wms?service=WMS&request=GetMap&version=1.3.0&layers=mtg_fd:rgb_geocolour&styles=&format=image/jpeg&crs=EPSG:4326&bbox=${encodeURIComponent(bbox)}&width=5000&height=2700&time=${encodeURIComponent(utcDate)}T${encodeURIComponent(utcHours)}:${encodeURIComponent(utcRoundedMinutes)}:00.000Z`;
            document.getElementById('meteosatEurope').src = imageUrl;
        });
        document.getElementById("button_switzerland").addEventListener("click", () => {
            bbox = "44,4,49,12";
            const imageUrl = `https://view.eumetsat.int/geoserver/wms?service=WMS&request=GetMap&version=1.3.0&layers=mtg_fd:rgb_geocolour&styles=&format=image/jpeg&crs=EPSG:4326&bbox=${encodeURIComponent(bbox)}&width=2500&height=1350&time=${encodeURIComponent(utcDate)}T${encodeURIComponent(utcHours)}:${encodeURIComponent(utcRoundedMinutes)}:00.000Z`;
            document.getElementById('meteosatEurope').src = imageUrl;
        });


        // Edit image link dynamically
        const imageUrl = `https://view.eumetsat.int/geoserver/wms?service=WMS&request=GetMap&version=1.3.0&layers=mtg_fd:rgb_geocolour&styles=&format=image/jpeg&crs=EPSG:4326&bbox=${encodeURIComponent(bbox)}&width=5000&height=2700&time=${encodeURIComponent(utcDate)}T${encodeURIComponent(utcHours)}:${encodeURIComponent(utcRoundedMinutes)}:00.000Z`;
        document.getElementById('meteosatEurope').src = imageUrl;

        // Edit timestamp on bottom
        document.getElementById('timestamp').innerHTML = utcDay + "." + utcMonth + "." + utcYear + " – " + utcHours + ":" + utcRoundedMinutes + " UTC"

    </script>

    <script>
        //auto refresh fn every 60 seconds
    function autoRefresh() {
        window.location = window.location.href;
    }
    setInterval('autoRefresh()', 60000);
    </script>
</body>
</html>
